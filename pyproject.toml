[project]
name = "mcp-beancount"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0",
    "beancount>=2.3",
    "beanquery>=0.2.0",
]

[project.scripts]
mcp-beancount = "mcp_beancount.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_beancount"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
